[package]
name = "jp-sot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ego-tree = "0.11"
futures = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2", "charset"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util", "rt", "macros", "time", "sync"] }
